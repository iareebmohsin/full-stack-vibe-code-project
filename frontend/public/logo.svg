<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main triangle shape (AI logo) -->
  <g filter="url(#glow)">
    <!-- Left line of triangle -->
    <path d="M 100 250 L 160 80" stroke="url(#blueGradient)" stroke-width="28" stroke-linecap="round" fill="none"/>

    <!-- Right line of triangle -->
    <path d="M 220 250 L 160 80" stroke="url(#blueGradient)" stroke-width="28" stroke-linecap="round" fill="none"/>

    <!-- Bottom line of triangle -->
    <path d="M 100 250 L 220 250" stroke="url(#blueGradient)" stroke-width="28" stroke-linecap="round" fill="none"/>

    <!-- Inner triangle (smaller) -->
    <path d="M 135 215 L 160 150 L 185 215 Z" fill="url(#blueGradient)" opacity="0.6"/>

    <!-- Corner circles -->
    <circle cx="100" cy="250" r="20" fill="#3b82f6"/>
    <circle cx="220" cy="250" r="20" fill="#3b82f6"/>
    <circle cx="160" cy="80" r="20" fill="#3b82f6"/>
  </g>

  <!-- Circuit/connection lines (tech effect) -->
  <g opacity="0.4">
    <!-- Left connections -->
    <line x1="50" y1="160" x2="100" y2="160" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="50" cy="160" r="4" fill="#60a5fa"/>
    <line x1="40" y1="180" x2="90" y2="190" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="40" cy="180" r="4" fill="#60a5fa"/>
    <line x1="55" y1="200" x2="95" y2="220" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="55" cy="200" r="4" fill="#60a5fa"/>

    <!-- Right connections -->
    <line x1="270" y1="160" x2="220" y2="160" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="270" cy="160" r="4" fill="#60a5fa"/>
    <line x1="280" y1="180" x2="230" y2="190" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="280" cy="180" r="4" fill="#60a5fa"/>
    <line x1="265" y1="200" x2="225" y2="220" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="265" cy="200" r="4" fill="#60a5fa"/>

    <!-- Top connections -->
    <line x1="160" y1="40" x2="160" y2="80" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="160" cy="40" r="4" fill="#60a5fa"/>
    <line x1="140" y1="50" x2="150" y2="75" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="140" cy="50" r="4" fill="#60a5fa"/>
    <line x1="180" y1="50" x2="170" y2="75" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="180" cy="50" r="4" fill="#60a5fa"/>
  </g>

  <!-- Bottom chip/circuit lines -->
  <g opacity="0.3">
    <line x1="120" y1="280" x2="120" y2="270" stroke="#60a5fa" stroke-width="2"/>
    <line x1="140" y1="280" x2="140" y2="270" stroke="#60a5fa" stroke-width="2"/>
    <line x1="160" y1="285" x2="160" y2="270" stroke="#60a5fa" stroke-width="2"/>
    <line x1="180" y1="280" x2="180" y2="270" stroke="#60a5fa" stroke-width="2"/>
    <line x1="200" y1="280" x2="200" y2="270" stroke="#60a5fa" stroke-width="2"/>
  </g>
</svg>
